apiVersion: 1

prune: true

datasources:
  - name: Scheduler PostgreSQL
    uid: scheduler-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana
    isDefault: true
    editable: false
    version: 1
    jsonData:
      database: postgres
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: super-strong-password
